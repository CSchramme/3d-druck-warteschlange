{% extends "base.html" %}
{% block title %}Admin-Login – 3D-Druck-Warteschlange{% endblock %}
{% block content %}
<section class="card narrow-card">
  <h1>Admin-Login</h1>
  {% if configured %}
    <form method="post" class="form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="field">
        <span>Passwort</span>
        <input name="password" type="password" required autofocus autocomplete="current-password">
      </label>
      <button class="btn btn-primary btn-block" type="submit">Anmelden</button>
    </form>
  {% else %}
    <p class="flash flash-error">Es ist kein <code>ADMIN_PASSWORD</code> gesetzt. Trag eins in die
      <code>.env</code>-Datei ein und starte die App neu.</p>
  {% endif %}
</section>
{% endblock %}
